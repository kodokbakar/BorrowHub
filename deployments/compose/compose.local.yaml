name: borrowhub

services:
  caddy:
    image: caddy:2.11.3-alpine
    network_mode: host
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: borrowhub
      POSTGRES_PASSWORD: borrowhub
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U borrowhub -d postgres
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: borrowhub
      RABBITMQ_DEFAULT_PASS: borrowhub
      RABBITMQ_DEFAULT_VHOST: borrowhub
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  rabbitmq_data: