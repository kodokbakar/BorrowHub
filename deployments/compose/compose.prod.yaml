name: borrowhub-prod

services:
  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    depends_on:
      identity:
        condition: service_healthy
      inventory:
        condition: service_healthy
      lending:
        condition: service_healthy
      notification:
        condition: service_healthy
      web:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: borrowhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U borrowhub -d postgres
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: borrowhub
      RABBITMQ_DEFAULT_PASS: borrowhub
      RABBITMQ_DEFAULT_VHOST: borrowhub
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped

  identity:
    build:
      context: ../../services/identity
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8081"
      DATABASE_URL: "postgres://borrowhub_identity:borrowhub_identity@postgres:5432/borrowhub_identity?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8081/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  inventory:
    build:
      context: ../../services/inventory
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8082"
      DATABASE_URL: "postgres://borrowhub_inventory:borrowhub_inventory@postgres:5432/borrowhub_inventory?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_BASE_URL: "http://identity:8081"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8082/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  lending:
    build:
      context: ../../services/lending
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8083"
      DATABASE_URL: "postgres://borrowhub_lending:borrowhub_lending@postgres:5432/borrowhub_lending?sslmode=disable"
      RABBITMQ_URL: "amqp://borrowhub:borrowhub@rabbitmq:5672/borrowhub"
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_BASE_URL: "http://identity:8081"
      INVENTORY_BASE_URL: "http://inventory:8082"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    expose:
      - "8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8083/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  notification:
    build:
      context: ../../workers/notification
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8084"
      DATABASE_URL: "postgres://borrowhub_notification:borrowhub_notification@postgres:5432/borrowhub_notification?sslmode=disable"
      RABBITMQ_URL: "amqp://borrowhub:borrowhub@rabbitmq:5672/borrowhub"
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      IDENTITY_BASE_URL: "http://identity:8081"
      SMTP_HOST: "mailpit"
      SMTP_PORT: 1025
      SMTP_FROM: "noreply@borrowhub.local"
    expose:
      - "8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8084/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  rabbitmq_prod_data:

networks:
  default:
    name: borrowhub_prod
