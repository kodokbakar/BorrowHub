name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
      placeholder: Explain what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Explain the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Start...
        2. Open...
        3. Submit...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web
        - Identity Service
        - Inventory Service
        - Lending Service
        - Notification Worker
        - Contracts
        - Infrastructure
        - Documentation
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA, tag, or branch

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, browser, Go version, Bun version, or Docker version

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, cookies, and personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal data.
          required: true