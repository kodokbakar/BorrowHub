openapi: 3.1.0

info:
  title: BorrowHub Lending Service API
  version: 0.1.0
  description: Equipment lending lifecycle, reservations, check-out tokens, and return processing.

servers:
  - url: http://lending.borrowhub.localhost:8080

security: []

paths:
  /health/live:
    get:
      summary: Periksa liveness Lending Service
      operationId: lendingHealthLive
      tags:
        - Health
      responses:
        "200":
          $ref: "./common.yaml#/components/responses/HealthOK"

  /health/ready:
    get:
      summary: Periksa readiness Lending Service
      operationId: lendingHealthReady
      tags:
        - Health
      responses:
        "200":
          $ref: "./common.yaml#/components/responses/HealthOK"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceNotReady"

  /api/v1/items/{itemId}/availability:
    get:
      summary: Check equipment item availability for a time window
      operationId: getItemAvailability
      tags:
        - Availability
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: start_time
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Availability calculation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ItemAvailability"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loan-requests:
    get:
      summary: List loan requests for an organization
      operationId: listLoanRequests
      tags:
        - Loan Requests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: requester_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RequestStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of loan requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/LoanRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      summary: Submit a new loan request
      operationId: createLoanRequest
      tags:
        - Loan Requests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanRequestPayload"
      responses:
        "201":
          description: Loan request successfully submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoanRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/loan-requests/{requestId}:
    get:
      summary: Get details of a specific loan request
      operationId: getLoanRequest
      tags:
        - Loan Requests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Loan request details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoanRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loan-requests/{requestId}/approve:
    post:
      summary: Approve a pending loan request and allocate a unit (Admin only)
      operationId: approveLoanRequest
      tags:
        - Loan Requests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewLoanRequestPayload"
      responses:
        "200":
          description: Request approved, loan created, checkout token generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ApprovedRequestResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/loan-requests/{requestId}/reject:
    post:
      summary: Reject a pending loan request (Admin only)
      operationId: rejectLoanRequest
      tags:
        - Loan Requests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewLoanRequestPayload"
      responses:
        "200":
          description: Request rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoanRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loan-requests/{requestId}/cancel:
    post:
      summary: Cancel a loan request (Requester if pending, or Admin)
      operationId: cancelLoanRequest
      tags:
        - Loan Requests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelLoanRequestPayload"
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoanRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loans:
    get:
      summary: List loans for an organization
      operationId: listLoans
      tags:
        - Loans
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoanStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of loans
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/loans/{loanId}:
    get:
      summary: Get details of a specific loan
      operationId: getLoan
      tags:
        - Loans
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Loan details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Loan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loans/{loanId}/check-out:
    post:
      summary: Validate checkout token and hand over equipment (Admin only)
      operationId: checkoutLoan
      tags:
        - Loans
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutLoanPayload"
      responses:
        "200":
          description: Loan checked out successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/loans/{loanId}/return:
    post:
      summary: Process equipment return and condition evaluation (Admin only)
      operationId: returnLoan
      tags:
        - Loans
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnLoanPayload"
      responses:
        "200":
          description: Loan returned successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Loan"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/organizations/{organizationId}/overdue:
    get:
      summary: List all overdue loans for an organization (Admin only)
      operationId: listOverdueLoans
      tags:
        - Loans
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of overdue loans
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Loan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/internal/scheduler/process-overdue:
    post:
      summary: Internal scheduler trigger to scan and mark overdue loans
      operationId: processOverdueLoans
      tags:
        - Internal
      security:
        - internalTokenAuth: []
      responses:
        "200":
          description: Overdue check completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProcessOverdueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    internalTokenAuth:
      type: apiKey
      in: header
      name: X-Internal-Token

  schemas:
    RequestStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled

    LoanStatus:
      type: string
      enum:
        - pending_checkout
        - checked_out
        - returned
        - overdue
        - cancelled

    ReturnCondition:
      type: string
      enum:
        - new
        - good
        - fair
        - poor
        - damaged

    ItemAvailability:
      type: object
      required:
        - item_id
        - start_time
        - end_time
        - total_units
        - available_units
        - is_available
      properties:
        item_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        total_units:
          type: integer
        available_units:
          type: integer
        is_available:
          type: boolean
        eligible_unit_ids:
          type: array
          items:
            type: string
            format: uuid

    LoanRequest:
      type: object
      required:
        - id
        - organization_id
        - requester_user_id
        - item_id
        - quantity
        - start_time
        - end_time
        - purpose
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        requester_user_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        purpose:
          type: string
        notes:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        reviewer_user_id:
          type: string
          format: uuid
        review_notes:
          type: string
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateLoanRequestPayload:
      type: object
      required:
        - organization_id
        - item_id
        - quantity
        - start_time
        - end_time
        - purpose
      properties:
        organization_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        purpose:
          type: string
        notes:
          type: string

    ReviewLoanRequestPayload:
      type: object
      properties:
        review_notes:
          type: string

    CancelLoanRequestPayload:
      type: object
      properties:
        reason:
          type: string

    Loan:
      type: object
      required:
        - id
        - organization_id
        - loan_request_id
        - reservation_id
        - unit_id
        - borrower_user_id
        - status
        - expected_return_time
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        loan_request_id:
          type: string
          format: uuid
        reservation_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        borrower_user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LoanStatus"
        checkout_time:
          type: string
          format: date-time
        expected_return_time:
          type: string
          format: date-time
        actual_return_time:
          type: string
          format: date-time
        return_condition:
          $ref: "#/components/schemas/ReturnCondition"
        return_notes:
          type: string
        processed_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApprovedRequestResult:
      type: object
      required:
        - loan_request
        - loan
        - checkout_token
      properties:
        loan_request:
          $ref: "#/components/schemas/LoanRequest"
        loan:
          $ref: "#/components/schemas/Loan"
        checkout_token:
          type: string

    CheckoutLoanPayload:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    ReturnLoanPayload:
      type: object
      required:
        - return_condition
      properties:
        return_condition:
          $ref: "#/components/schemas/ReturnCondition"
        return_notes:
          type: string

    ProcessOverdueResponse:
      type: object
      required:
        - processed_count
        - processed_at
      properties:
        processed_count:
          type: integer
        processed_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/ErrorEnvelope"

    Forbidden:
      description: Insufficient permissions or not a member of organization
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/ErrorEnvelope"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/ErrorEnvelope"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/ErrorEnvelope"

    Conflict:
      description: Resource conflict or double-booking
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/ErrorEnvelope"
