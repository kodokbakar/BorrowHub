openapi: 3.1.0

info:
  title: BorrowHub Lending Service API
  version: 0.1.0

servers:
  - url: http://lending.borrowhub.localhost:8080

security: []

paths:
  /health/live:
    get:
      summary: Periksa liveness Lending Service
      operationId: lendingHealthLive
      tags:
        - Health
      responses:
        "200":
          $ref: "./common.yaml#/components/responses/HealthOK"

  /health/ready:
    get:
      summary: Periksa readiness Lending Service
      operationId: lendingHealthReady
      tags:
        - Health
      responses:
        "200":
          $ref: "./common.yaml#/components/responses/HealthOK"
        "503":
          $ref: "./common.yaml#/components/responses/ServiceNotReady"